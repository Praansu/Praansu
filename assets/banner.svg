<svg width="2000" height="420" viewBox="0 0 2000 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <filter id="pulse">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="2000" height="420" fill="url(#deep)"/>

  <!-- left computational anchor bar -->
  <rect x="72" y="72" width="2.5" height="276" fill="#c9a227"/>

  <!-- right-side neural network motif -->
  <circle cx="1730" cy="100" r="1.5" fill="#2d2d3a"/>
  <circle cx="1810" cy="160" r="1.5" fill="#2d2d3a"/>
  <circle cx="1890" cy="230" r="1.5" fill="#2d2d3a"/>
  <circle cx="1960" cy="310" r="1.5" fill="#2d2d3a"/>
  <circle cx="1770" cy="350" r="1.5" fill="#2d2d3a"/>

  <line x1="1730" y1="100" x2="1810" y2="160" stroke="#1f1f28" stroke-width="1"/>
  <line x1="1810" y1="160" x2="1890" y2="230" stroke="#1f1f28" stroke-width="1"/>
  <line x1="1890" y1="230" x2="1960" y2="310" stroke="#1f1f28" stroke-width="1"/>

  <!-- gold active node with pulse -->
  <circle cx="1770" cy="350" r="3" fill="#c9a227" filter="url(#pulse)"/>

  <!-- large serif watermark -->
  <text x="1480" y="390" font-family="Georgia, serif" font-size="700" font-weight="700" fill="#121216" opacity="0.04">P</text>

  <!-- name — larger for readability -->
  <text x="110" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="-0.015em" fill="#ffffff">Praansu Karmacharya</text>

  <!-- tagline — larger, two lines -->
  <text x="110" y="236" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#c9a227" letter-spacing="0.006em">I build ML models and the products around them.</text>

  <text x="110" y="268" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#c9a227" letter-spacing="0.006em">Things break. I fix them. I ship what works.</text>

  <!-- role — larger -->
  <text x="110" y="310" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#94a3b8" letter-spacing="0.01em">CS student · Islington College Kathmandu · AI developer intern @ Aviyaan Tech</text>

  <!-- rule + gold tick -->
  <line x1="110" y1="344" x2="1500" y2="344" stroke="#1f1f28" stroke-width="1"/>
  <rect x="110" y="340" width="56" height="5" fill="#c9a227"/>

  <!-- gold square -->
  <rect x="1850" y="70" width="32" height="32" fill="#c9a227" opacity="0.06"/>
</svg>
