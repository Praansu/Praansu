<svg width="2000" height="400" viewBox="0 0 2000 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="60%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="2000" height="400" fill="url(#deep)"/>

  <!-- subtle radial vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.02"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <rect width="2000" height="400" fill="url(#vignette)"/>

  <!-- left computational anchor bar -->
  <rect x="72" y="64" width="3" height="272" fill="#c9a227"/>

  <!-- network motif: subtle dots and connection lines (right side) -->
  <circle cx="1720" cy="92" r="1.5" fill="#2d2d3a"/>
  <circle cx="1790" cy="158" r="1.5" fill="#2d2d3a"/>
  <circle cx="1860" cy="230" r="1.5" fill="#2d2d3a"/>
  <circle cx="1930" cy="302" r="1.5" fill="#2d2d3a"/>
  <circle cx="1750" cy="330" r="1.5" fill="#2d2d3a"/>

  <line x1="1720" y1="92" x2="1790" y2="158" stroke="#1f1f28" stroke-width="1"/>
  <line x1="1790" y1="158" x2="1860" y2="230" stroke="#1f1f28" stroke-width="1"/>
  <line x1="1860" y1="230" x2="1930" y2="302" stroke="#1f1f28" stroke-width="1"/>

  <!-- small gold node -->
  <circle cx="1750" cy="330" r="2.5" fill="#c9a227" filter="url(#softglow)"/>

  <!-- large serif watermark -->
  <text x="1520" y="360" font-family="Georgia, serif" font-size="640" font-weight="700" fill="#121216" opacity="0.05">P</text>

  <!-- name -->
  <text x="110" y="156" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" letter-spacing="-0.015em" fill="#ffffff">Praansu Karmacharya</text>

  <!-- tagline -->
  <text x="110" y="220" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#94a3b8" letter-spacing="0.006em">I build ML models and the products around them.</text>

  <text x="110" y="244" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#94a3b8" letter-spacing="0.006em">Things break. I fix them. I ship what works.</text>

  <!-- role -->
  <text x="110" y="284" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" letter-spacing="0.01em">CS student · Islington College Kathmandu · AI developer intern @ Aviyaan Tech</text>

  <!-- rule + gold tick -->
  <line x1="110" y1="316" x2="1520" y2="316" stroke="#1f1f28" stroke-width="1"/>
  <rect x="110" y="312" width="56" height="5" fill="#c9a227"/>

  <!-- gold square -->
  <rect x="1850" y="60" width="32" height="32" fill="#c9a227" opacity="0.06"/>
</svg>
