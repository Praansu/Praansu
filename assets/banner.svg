<svg width="2000" height="300" viewBox="0 0 2000 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="2000" height="300" fill="url(#deep)"/>

  <!-- left computational anchor bar -->
  <rect x="72" y="52" width="3" height="196" fill="#c9a227"/>

  <!-- right-side neural network motif -->
  <circle cx="1740" cy="70" r="1.5" fill="#2d2d3a"/>
  <circle cx="1820" cy="130" r="1.5" fill="#2d2d3a"/>
  <circle cx="1900" cy="200" r="1.5" fill="#2d2d3a"/>
  <circle cx="1970" cy="270" r="1.5" fill="#2d2d3a"/>

  <line x1="1740" y1="70" x2="1820" y2="130" stroke="#1f1f28" stroke-width="1"/>
  <line x1="1820" y1="130" x2="1900" y2="200" stroke="#1f1f28" stroke-width="1"/>
  <line x1="1900" y1="200" x2="1970" y2="270" stroke="#1f1f28" stroke-width="1"/>

  <!-- large serif watermark -->
  <text x="1420" y="270" font-family="Georgia, serif" font-size="500" font-weight="700" fill="#121216" opacity="0.03">P</text>

  <!-- name — much larger -->
  <text x="110" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="100" font-weight="700" letter-spacing="-0.01em" fill="#ffffff">Praansu Karmacharya</text>

  <!-- tagline — large, gold accent -->
  <text x="110" y="180" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#c9a227" letter-spacing="0.005em">I build ML models and the products around them.</text>

  <text x="110" y="216" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#c9a227" letter-spacing="0.005em">Things break. I fix them. I ship what works.</text>

  <!-- role — larger -->
  <text x="110" y="256" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#94a3b8" letter-spacing="0.01em">CS student · Islington College Kathmandu · AI developer intern @ Aviyaan Tech</text>

  <!-- rule + gold tick -->
  <line x1="110" y1="280" x2="1500" y2="280" stroke="#1f1f28" stroke-width="1"/>
  <rect x="110" y="276" width="56" height="4" fill="#c9a227"/>

  <!-- gold square -->
  <rect x="1870" y="52" width="40" height="40" fill="#c9a227" opacity="0.05"/>
</svg>
